version: "3.9"

services:
  proxy:
    build: .
    container_name: zero-trust-proxy
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
    depends_on:
      - user-service
      - payment-service
      - db-service
    networks:
      - mesh

  user-service:
    build: ./services/user-service
    container_name: user-service
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
    networks:
      - mesh

  payment-service:
    build: ./services/payment-service
    container_name: payment-service
    ports:
      - "5002:5002"
    environment:
      - PORT=5002
    networks:
      - mesh

  db-service:
    build: ./services/db-service
    container_name: db-service
    ports:
      - "5003:5003"
    environment:
      - PORT=5003
    networks:
      - mesh

networks:
  mesh:
    driver: bridge
